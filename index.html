    <style>
      html, body { margin: 0; background: #04060c; }
      #boot {
        position: fixed; inset: 0; z-index: 100; background: #04060c; color: #a3b0c2;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        transition: opacity 500ms ease;
      }
      #boot.boot-out { opacity: 0; pointer-events: none; }
      #boot svg { width: 56px; height: 56px; color: #22d3ee; }
      #boot .boot-orbit { transform-origin: 13px 13px; animation: boot-spin 6s linear infinite; }
      #boot .boot-label {
        font: 600 13px/1 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 0.16em; color: #e8edf5;
      }
      #boot .boot-line { position: relative; width: 160px; height: 2px; overflow: hidden; background: rgba(148, 163, 184, 0.16); border-radius: 2px; }
      #boot .boot-line::after {
        content: ''; position: absolute; top: 0; bottom: 0; width: 40%; background: #22d3ee; border-radius: 2px;
        animation: boot-run 1.4s ease-in-out infinite;
      }
      #boot noscript { max-width: 320px; text-align: center; font: 14px/1.5 system-ui, sans-serif; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-run { from { left: -40%; } to { left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-orbit, #boot .boot-line::after { animation-duration: 0.001ms; animation-iteration-count: 1; }
        #boot { transition-duration: 0.001ms; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="13" cy="13" r="3.2" fill="currentColor" stroke="none" />
        <g class="boot-orbit"><ellipse cx="13" cy="13" rx="11.5" ry="5" transform="rotate(-28 13 13)" /></g>
      </svg>
      <div class="boot-label">ASTROMETRIC SCALE ENGINE</div>
      <div class="boot-line"></div>
      <noscript>Astrometric Scale Engine needs JavaScript to run. Please turn it on in your browser and reload the page.</noscript>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
